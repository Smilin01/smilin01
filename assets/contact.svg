<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img">
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F3A8A" flood-opacity=".08"/></filter>
<linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF2FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1E6"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8DB8FF"/><stop offset="1" stop-color="#1A6BF0"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.a1{opacity:0;animation:fi .8s ease-out .1s forwards}.a2{opacity:0;animation:fi .8s ease-out .35s forwards}.a3{opacity:0;animation:fi .8s ease-out .6s forwards}.a4{opacity:0;animation:fi .8s ease-out .85s forwards}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bl{50%{opacity:0}}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes da{to{stroke-dashoffset:-14}}
.pu{animation:pu 2.4s ease-in-out infinite}
</style>
<rect width="720" height="230" fill="#FBF8F4"/>
<rect x="16" y="12" width="688" height="206" rx="24" fill="url(#gb)" stroke="#ECE7DF" filter="url(#sh)"/>
<text x="40" y="52" font-size="11" letter-spacing="3" fill="#6B7280">OPEN TO</text><circle cx="128" cy="48" r="3.5" class="pu" fill="#1A6BF0"/><text x="40" y="94" font-size="27" font-weight="500" fill="#0F1B33">Let's build AI that does real work.</text><text x="40" y="128" font-size="27" font-weight="500" fill="#1A6BF0">johnsmilin.in</text><rect x="40" y="150" width="137" height="30" rx="15.0" fill="#EEF4FF" stroke="#D9E6FF"/><text x="108.5" y="169.55" font-size="13" font-weight="500" fill="#1A6BF0" text-anchor="middle">Agentic systems</text>
<rect x="187" y="150" width="115" height="30" rx="15.0" fill="#EEF4FF" stroke="#D9E6FF"/><text x="244.5" y="169.55" font-size="13" font-weight="500" fill="#1A6BF0" text-anchor="middle">Applied LLMs</text>
<rect x="312" y="150" width="115" height="30" rx="15.0" fill="#EEF4FF" stroke="#D9E6FF"/><text x="369.5" y="169.55" font-size="13" font-weight="500" fill="#1A6BF0" text-anchor="middle">AI platforms</text>
<text x="680" y="196" text-anchor="end" font-size="30" font-style="italic" fill="#0F1B33" style="font-family:'Snell Roundhand','Brush Script MT','Segoe Script',cursive">John Smilin D.S</text></svg>