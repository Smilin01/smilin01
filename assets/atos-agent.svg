<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img">
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F3A8A" flood-opacity=".08"/></filter>
<linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF2FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1E6"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8DB8FF"/><stop offset="1" stop-color="#1A6BF0"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.a1{opacity:0;animation:fi .8s ease-out .1s forwards}.a2{opacity:0;animation:fi .8s ease-out .35s forwards}.a3{opacity:0;animation:fi .8s ease-out .6s forwards}.a4{opacity:0;animation:fi .8s ease-out .85s forwards}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bl{50%{opacity:0}}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes da{to{stroke-dashoffset:-14}}
.dsh{stroke-dasharray:5 5;animation:da 1.2s linear infinite}.pu{animation:pu 2.4s ease-in-out infinite}
</style>
<rect width="720" height="440" fill="#FBF8F4"/>
<rect x="16" y="14" width="688" height="412" rx="24" fill="url(#gb)" stroke="#ECE7DF" filter="url(#sh)"/>
<text x="40" y="52" font-size="13" fill="#6B7280">01</text><line x1="64" y1="48" x2="104" y2="48" stroke="#C9D8F5"/><text x="670" y="52" text-anchor="end" font-size="11" letter-spacing="2.5" fill="#6B7280">FLAGSHIP PROJECT · ATOS</text><circle cx="684" cy="48" r="4" class="pu" fill="#1A6BF0"/><text x="40" y="104" font-size="36" font-weight="800" fill="#0F1B33" letter-spacing="-1"><tspan fill="#1A6BF0">Atos</tspan> Coding Agent</text><text x="40" y="142" font-size="16" fill="#3D4A63">I designed, built and own this project from the first</text><text x="40" y="166" font-size="16" fill="#3D4A63">line to rollout. A coding agent that plans a task,</text><text x="40" y="190" font-size="16" fill="#3D4A63">calls tools, edits code, and verifies its own work</text><text x="40" y="214" font-size="16" fill="#3D4A63">before handing it back.</text><rect x="40" y="248" width="104" height="32" rx="16.0" fill="#EEF4FF" stroke="#D9E6FF"/><text x="92.0" y="268.725" font-size="13.5" font-weight="500" fill="#1A6BF0" text-anchor="middle">Agent Loop</text>
<rect x="154" y="248" width="88" height="32" rx="16.0" fill="#EEF4FF" stroke="#D9E6FF"/><text x="198.0" y="268.725" font-size="13.5" font-weight="500" fill="#1A6BF0" text-anchor="middle">Tool Use</text>
<rect x="252" y="248" width="119" height="32" rx="16.0" fill="#EEF4FF" stroke="#D9E6FF"/><text x="311.5" y="268.725" font-size="13.5" font-weight="500" fill="#1A6BF0" text-anchor="middle">Code Editing</text>
<rect x="381" y="248" width="119" height="32" rx="16.0" fill="#EEF4FF" stroke="#D9E6FF"/><text x="440.5" y="268.725" font-size="13.5" font-weight="500" fill="#1A6BF0" text-anchor="middle">Verification</text>
<rect x="510" y="248" width="149" height="32" rx="16.0" fill="#EEF4FF" stroke="#D9E6FF"/><text x="584.5" y="268.725" font-size="13.5" font-weight="500" fill="#1A6BF0" text-anchor="middle">Production Ready</text>
<rect x="40" y="304" width="145" height="74" rx="14" fill="#fff" stroke="#DCE6F8" filter="url(#sh)"/><circle cx="58" cy="324" r="4" fill="#1A6BF0"/><text x="70" y="328" font-size="10.5" letter-spacing="1.5" fill="#6B7280">STEP 01</text><text x="56" y="352" font-size="16" font-weight="700" fill="#0F1B33">PLAN</text><text x="56" y="369" font-size="12" fill="#1A6BF0">break it down</text><path d="M188 341 H202" stroke="#1A6BF0" stroke-width="1.6"/><path d="M199 337 L203 341 L199 345" fill="none" stroke="#1A6BF0" stroke-width="1.6"/><rect x="205" y="304" width="145" height="74" rx="14" fill="#fff" stroke="#DCE6F8" filter="url(#sh)"/><circle cx="223" cy="324" r="4" fill="#1A6BF0"/><text x="235" y="328" font-size="10.5" letter-spacing="1.5" fill="#6B7280">STEP 02</text><text x="221" y="352" font-size="16" font-weight="700" fill="#0F1B33">CALL TOOLS</text><text x="221" y="369" font-size="12" fill="#1A6BF0">read · search</text><path d="M353 341 H367" stroke="#1A6BF0" stroke-width="1.6"/><path d="M364 337 L368 341 L364 345" fill="none" stroke="#1A6BF0" stroke-width="1.6"/><rect x="370" y="304" width="145" height="74" rx="14" fill="#fff" stroke="#DCE6F8" filter="url(#sh)"/><circle cx="388" cy="324" r="4" fill="#1A6BF0"/><text x="400" y="328" font-size="10.5" letter-spacing="1.5" fill="#6B7280">STEP 03</text><text x="386" y="352" font-size="16" font-weight="700" fill="#0F1B33">EDIT</text><text x="386" y="369" font-size="12" fill="#1A6BF0">change code</text><path d="M518 341 H532" stroke="#1A6BF0" stroke-width="1.6"/><path d="M529 337 L533 341 L529 345" fill="none" stroke="#1A6BF0" stroke-width="1.6"/><rect x="535" y="304" width="145" height="74" rx="14" fill="#fff" stroke="#DCE6F8" filter="url(#sh)"/><circle cx="553" cy="324" r="4" fill="#1A6BF0"/><text x="565" y="328" font-size="10.5" letter-spacing="1.5" fill="#6B7280">STEP 04</text><text x="551" y="352" font-size="16" font-weight="700" fill="#0F1B33">VERIFY</text><text x="551" y="369" font-size="12" fill="#1A6BF0">tests · lint</text><path class="dsh" d="M 592 380 V 400 H 112 V 382" fill="none" stroke="#1A6BF0" stroke-width="1.3" stroke-opacity=".7"/><path d="M108 388 L112 380 L116 388" fill="none" stroke="#1A6BF0" stroke-width="1.5"/><text x="360" y="416" text-anchor="middle" font-size="11" letter-spacing="2" fill="#6B7280">LOOP UNTIL VERIFIED</text></svg>