<svg xmlns="http://www.w3.org/2000/svg" width="480" height="664" viewBox="0 0 480 664" role="img" aria-label="John Smilin D.S. — Building agents that ship">
<style>.m{font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace} .s{font-size:11.5px;letter-spacing:.6px;font-weight:700} .xs{font-size:10px;letter-spacing:1.2px}
.big{font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:35px;font-weight:700;letter-spacing:-1px} .sf{font-family:Georgia,'Times New Roman',serif;font-size:16px}
.fl{animation:fl 4.5s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.dash{stroke-dashoffset:40;animation:dr 1.2s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}
text.s{animation:fi .8s ease-out .6s forwards}@keyframes fi{to{opacity:1}}
.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.t1{opacity:0;animation:fi .7s ease-out .1s forwards}.t2{opacity:0;animation:fi .7s ease-out .5s forwards}.t3{opacity:0;animation:fi .7s ease-out .9s forwards}.t4{opacity:0;animation:fi .7s ease-out 1.3s forwards}
.dot{animation:mv 6s linear infinite}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(416px)}}</style>
<rect width="480" height="664" fill="#F6F5EF"/><rect x="0.5" y="0.5" width="479" height="663" fill="none" stroke="#e3e1d6"/>
