<svg xmlns="http://www.w3.org/2000/svg" width="80" height="34" viewBox="0 0 80 34" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#1D1D1F}
.m{fill:#6E6E73}.b{fill:#0071E3}.hl{stroke:#D2D2D7}.bd{fill:#0071E3}
@media (prefers-color-scheme:dark){text{fill:#F5F5F7}.m{fill:#A1A1A6}.b{fill:#2997FF}.hl{stroke:#424245}.bd{fill:#2997FF}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.u1{animation:up .9s cubic-bezier(.2,.7,.2,1) .1s backwards}.u2{animation:up .9s cubic-bezier(.2,.7,.2,1) .3s backwards}.u3{animation:up .9s cubic-bezier(.2,.7,.2,1) .5s backwards}.u4{animation:up .9s cubic-bezier(.2,.7,.2,1) .7s backwards}
@keyframes pu{0%,100%{opacity:.3}50%{opacity:1}}.pu{animation:pu 2.4s ease-in-out infinite}
@keyframes bl{50%{opacity:0}}.cur{animation:bl 1.1s steps(1) infinite}</style>
