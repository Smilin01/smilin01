<svg xmlns="http://www.w3.org/2000/svg" width="720" height="346" viewBox="0 0 720 346" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#1D1D1F}
.m{fill:#6E6E73}.b{fill:#0071E3}.hl{stroke:#D2D2D7}.bd{fill:#0071E3}
@media (prefers-color-scheme:dark){text{fill:#F5F5F7}.m{fill:#A1A1A6}.b{fill:#2997FF}.hl{stroke:#424245}.bd{fill:#2997FF}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.u1{animation:up .9s cubic-bezier(.2,.7,.2,1) .1s backwards}.u2{animation:up .9s cubic-bezier(.2,.7,.2,1) .3s backwards}.u3{animation:up .9s cubic-bezier(.2,.7,.2,1) .5s backwards}.u4{animation:up .9s cubic-bezier(.2,.7,.2,1) .7s backwards}
@keyframes pu{0%,100%{opacity:.3}50%{opacity:1}}.pu{animation:pu 2.4s ease-in-out infinite}
@keyframes bl{50%{opacity:0}}.cur{animation:bl 1.1s steps(1) infinite}</style>
<text x="40" y="46" font-size="14" font-weight="600" class="m" text-anchor="start" letter-spacing="0" >Autonomous coding agent</text><text x="40" y="90" font-size="34" font-weight="700" class="" text-anchor="start" letter-spacing="-0.8" >Atos Coding Agent</text><text x="40" y="128" font-size="17" font-weight="400" class="m" text-anchor="start" letter-spacing="0" >Plans a task, calls tools, edits code and verifies its own</text><text x="40" y="154" font-size="17" font-weight="400" class="m" text-anchor="start" letter-spacing="0" >work before handing anything back. Designed and built solo.</text><line x1="40" y1="190" x2="680" y2="190" class="hl"/><text x="40" y="246" font-size="46" font-weight="700" class="" text-anchor="start" letter-spacing="-1.5" >1</text><text x="40" y="272" font-size="14" font-weight="400" class="m" text-anchor="start" letter-spacing="0" >engineer, design to rollout</text><text x="256" y="246" font-size="46" font-weight="700" class="" text-anchor="start" letter-spacing="-1.5" >4</text><text x="256" y="272" font-size="14" font-weight="400" class="m" text-anchor="start" letter-spacing="0" >stage loop, plan to verify</text><text x="472" y="246" font-size="46" font-weight="700" class="" text-anchor="start" letter-spacing="-1.5" >3</text><text x="472" y="272" font-size="14" font-weight="400" class="m" text-anchor="start" letter-spacing="0" >layers: loop, tools, skills</text><text x="40" y="318" font-size="14" font-weight="400" class="m" text-anchor="start" letter-spacing="0" >Agent loop  ·  Tool use  ·  Reusable skills  ·  MCP</text></svg>