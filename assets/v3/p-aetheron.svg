<text x="40" y="46" font-size="14" font-weight="600" class="m" text-anchor="start" letter-spacing="0" >Privacy-first AI search</text><text x="40" y="90" font-size="34" font-weight="700" class="" text-anchor="start" letter-spacing="-0.8" >Aetheron AI</text><text x="40" y="128" font-size="17" font-weight="400" class="m" text-anchor="start" letter-spacing="0" >Answers questions with retrieval over a self-hosted search</text><text x="40" y="154" font-size="17" font-weight="400" class="m" text-anchor="start" letter-spacing="0" >stack, streamed to the interface as they are written.</text><line x1="40" y1="190" x2="680" y2="190" class="hl"/><text x="40" y="246" font-size="46" font-weight="700" class="" text-anchor="start" letter-spacing="-1.5" >0</text><text x="40" y="272" font-size="14" font-weight="400" class="m" text-anchor="start" letter-spacing="0" >paid search APIs</text><text x="256" y="246" font-size="46" font-weight="700" class="" text-anchor="start" letter-spacing="-1.5" >100%</text><text x="256" y="272" font-size="14" font-weight="400" class="m" text-anchor="start" letter-spacing="0" >self-hosted retrieval</text><text x="472" y="246" font-size="46" font-weight="700" class="" text-anchor="start" letter-spacing="-1.5" >SSE</text><text x="472" y="272" font-size="14" font-weight="400" class="m" text-anchor="start" letter-spacing="0" >streamed answers</text><text x="40" y="318" font-size="14" font-weight="400" class="m" text-anchor="start" letter-spacing="0" >Next.js 14  ·  Groq Llama 4  ·  RAG  ·  SearXNG  ·  Jina Reader</text></svg>