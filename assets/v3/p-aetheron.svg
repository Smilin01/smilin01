<svg xmlns="http://www.w3.org/2000/svg" width="720" height="346" viewBox="0 0 720 346" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#1D1D1F}
.m{fill:#6E6E73}.b{fill:#0071E3}.hl{stroke:#D2D2D7}.bd{fill:#0071E3}
