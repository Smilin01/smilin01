<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#1D1D1F}
.m{fill:#6E6E73}.b{fill:#0071E3}.hl{stroke:#D2D2D7}.bd{fill:#0071E3}
@media (prefers-color-scheme:dark){text{fill:#F5F5F7}.m{fill:#A1A1A6}.b{fill:#2997FF}.hl{stroke:#424245}.bd{fill:#2997FF}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.u1{animation:up .9s cubic-bezier(.2,.7,.2,1) .1s backwards}.u2{animation:up .9s cubic-bezier(.2,.7,.2,1) .3s backwards}.u3{animation:up .9s cubic-bezier(.2,.7,.2,1) .5s backwards}.u4{animation:up .9s cubic-bezier(.2,.7,.2,1) .7s backwards}
@keyframes pu{0%,100%{opacity:.3}50%{opacity:1}}.pu{animation:pu 2.4s ease-in-out infinite}
@keyframes bl{50%{opacity:0}}.cur{animation:bl 1.1s steps(1) infinite}</style>
<text x="360" y="70" font-size="13" font-weight="600" class="m u1" text-anchor="middle" letter-spacing="2.5" >AI ENGINEER  ·  ATOS</text><circle cx="262" cy="66" r="3" class="bd pu"/><text x="360" y="150" font-size="56" font-weight="700" class="u2" text-anchor="middle" letter-spacing="-1.8" >Agentic AI,</text><text x="360" y="214" font-size="56" font-weight="700" text-anchor="middle" letter-spacing="-1.8" class="b u3">built for production.</text><text x="360" y="268" font-size="19" font-weight="400" class="m u4" text-anchor="middle" letter-spacing="0" >I design agent systems end to end: reasoning loops,</text><text x="360" y="294" font-size="19" font-weight="400" class="m u4" text-anchor="middle" letter-spacing="0" >tool use, retrieval and the cloud that runs them.</text><text x="360" y="350" font-size="15" font-weight="600" class="u4" text-anchor="middle" letter-spacing="0" >John Smilin D.S.</text></svg>