<line class="dash" x1="762" y1="118" x2="802" y2="118" stroke="#2B5BFF" stroke-width="0.8" stroke-dasharray="2 3" style="animation-delay:0.35s"/>
<text x="808" y="121" class="m s" fill="#2B5BFF" style="animation-delay:0.35s" opacity="0">CODING AGENT · ATOS</text>
