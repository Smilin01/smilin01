<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img">
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F3A8A" flood-opacity=".08"/></filter>
<linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF2FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1E6"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8DB8FF"/><stop offset="1" stop-color="#1A6BF0"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.a1{opacity:0;animation:fi .8s ease-out .1s forwards}.a2{opacity:0;animation:fi .8s ease-out .35s forwards}.a3{opacity:0;animation:fi .8s ease-out .6s forwards}.a4{opacity:0;animation:fi .8s ease-out .85s forwards}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bl{50%{opacity:0}}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes da{to{stroke-dashoffset:-14}}
.fl{animation:fl 5s ease-in-out infinite}.cur{animation:bl 1s steps(1) infinite}.pu{animation:pu 2.4s ease-in-out infinite}
</style>
<rect width="720" height="340" fill="#FBF8F4"/>
<text x="40" y="44" class="a1" font-size="12" letter-spacing="3.5" fill="#6B7280">JOHN SMILIN D.S.</text>
<circle cx="508" cy="40" r="4" class="pu" fill="#1A6BF0"/><text x="680" y="44" text-anchor="end" class="a1" font-size="12" letter-spacing="2.5" fill="#6B7280">AI ENGINEER · ATOS</text>
<text x="40" y="118" class="a2" font-size="54" font-weight="800" fill="#0F1B33" letter-spacing="-1.5">Building</text>
<text x="40" y="178" class="a2" font-size="54" font-weight="800" fill="#1A6BF0" letter-spacing="-1.5">Agents</text>
<text x="40" y="238" class="a3" font-size="54" font-weight="800" fill="#0F1B33" letter-spacing="-1.5">That Ship.<tspan class="cur" fill="#1A6BF0" font-weight="300">|</tspan></text>
<text x="40" y="282" class="a4" font-size="16" fill="#6B7280">AI Engineer at Atos · Designing, building</text><text x="40" y="304" class="a4" font-size="16" fill="#6B7280">and shipping AI agents and real products.</text>
<g class="fl" style="animation-delay:0.0s"><polygon points="437,135 545,95 653,135 545,175" fill="url(#gl)" fill-opacity="0.35" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/></g>
<g class="fl" style="animation-delay:0.4s"><polygon points="437,165 545,125 653,165 545,205" fill="url(#gl)" fill-opacity="0.5" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/></g>
<g class="fl" style="animation-delay:0.8s"><polygon points="437,195 545,155 653,195 545,235" fill="url(#gl)" fill-opacity="0.7" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/></g>
<g class="fl" style="animation-delay:1.2000000000000002s"><polygon points="437,225 545,185 653,225 545,265" fill="url(#gl)" fill-opacity="0.9" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/></g>
<circle cx="395" cy="72" r="6" fill="#DCE8FF"/><circle cx="395" cy="72" r="3.5" class="pu" fill="#1A6BF0"/><text x="409" y="76" text-anchor="start" font-size="11" letter-spacing="2" fill="#6B7280">PLAN</text>
<circle cx="690" cy="72" r="6" fill="#DCE8FF"/><circle cx="690" cy="72" r="3.5" class="pu" fill="#1A6BF0"/><text x="676" y="76" text-anchor="end" font-size="11" letter-spacing="2" fill="#6B7280">TOOLS</text>
<circle cx="395" cy="275" r="6" fill="#DCE8FF"/><circle cx="395" cy="275" r="3.5" class="pu" fill="#1A6BF0"/><text x="409" y="279" text-anchor="start" font-size="11" letter-spacing="2" fill="#6B7280">CODE</text>
<circle cx="690" cy="275" r="6" fill="#DCE8FF"/><circle cx="690" cy="275" r="3.5" class="pu" fill="#1A6BF0"/><text x="676" y="279" text-anchor="end" font-size="11" letter-spacing="2" fill="#6B7280">VERIFY</text>
