<line x1="48" y1="326" x2="952" y2="326" stroke="#cfcdc0" stroke-width="1" stroke-dasharray="1 5"/>
<g class="dot"><rect x="48" y="323" width="16" height="6" fill="#2B5BFF" class="scan"/></g>
