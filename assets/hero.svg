<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="John Smilin D.S. — Building agents that ship">
<style>.m{font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace} .xs{font-size:11px;letter-spacing:1.2px}
@keyframes fi{to{opacity:1}}
.t1{opacity:0;animation:fi .7s ease-out .1s forwards}.t2{opacity:0;animation:fi .7s ease-out .5s forwards}.t3{opacity:0;animation:fi .7s ease-out .9s forwards}.t4{opacity:0;animation:fi .7s ease-out 1.3s forwards}
.big{font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:46px;font-weight:700;letter-spacing:-1.5px}
.fl{animation:fl 4.5s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.dot{animation:mv 6s linear infinite}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(644px)}}</style>
<rect width="720" height="340" fill="#F6F5EF"/><rect x=".5" y=".5" width="719" height="339" fill="none" stroke="#e3e1d6"/>
<text x="40" y="38" class="m xs t1" fill="#2B5BFF">FIG_000 · PROFILE · V1.0</text>
<text x="680" y="38" text-anchor="end" class="m xs t1" fill="#8a8a85">AT ATOS</text>
<text x="40" y="112" class="big t2" fill="#2B5BFF">BUILDING</text>
<text x="40" y="164" class="big t2" fill="#2B5BFF">AGENTS</text>
<text x="40" y="216" class="big t3" fill="#111111">THAT SHIP.<tspan class="cur" fill="#2B5BFF">_</tspan></text>
<text x="40" y="262" class="m t4" fill="#111111" style="font-size:15px;font-weight:700;letter-spacing:.5px">AI ENGINEER @ ATOS</text>
<text x="40" y="284" class="m xs t4" fill="#8a8a85">JOHN SMILIN D.S.</text>
<g class="fl" style="animation-delay:0.0s"><polygon points="456,96 540,66 624,96 540,126" fill="#2B5BFF" fill-opacity="0.25" stroke="#2B5BFF" stroke-width="1.3"/></g>
<g class="fl" style="animation-delay:0.35s"><polygon points="456,126 540,96 624,126 540,156" fill="#2B5BFF" fill-opacity="0.23" stroke="#2B5BFF" stroke-width="1.3"/></g>
<g class="fl" style="animation-delay:0.7s"><polygon points="456,156 540,126 624,156 540,186" fill="#2B5BFF" fill-opacity="0.20" stroke="#2B5BFF" stroke-width="1.3"/></g>
<g class="fl" style="animation-delay:1.0499999999999998s"><polygon points="456,186 540,156 624,186 540,216" fill="#2B5BFF" fill-opacity="0.18" stroke="#2B5BFF" stroke-width="1.3"/></g>
<g class="fl" style="animation-delay:1.4s"><polygon points="456,216 540,186 624,216 540,246" fill="#2B5BFF" fill-opacity="0.15" stroke="#2B5BFF" stroke-width="1.3"/></g>
<g class="fl" style="animation-delay:1.75s"><polygon points="456,246 540,216 624,246 540,276" fill="#2B5BFF" fill-opacity="0.12" stroke="#2B5BFF" stroke-width="1.3"/></g>
<g class="fl" style="animation-delay:2.0999999999999996s"><polygon points="456,276 540,246 624,276 540,306" fill="#2B5BFF" fill-opacity="0.10" stroke="#2B5BFF" stroke-width="1.3"/></g>

<line x1="40" y1="318" x2="680" y2="318" stroke="#cfcdc0" stroke-dasharray="1 5"/>
<g class="dot"><rect x="40" y="315" width="16" height="6" fill="#2B5BFF"/></g>
</svg>