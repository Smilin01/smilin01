<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="John Smilin D.S. — AI Engineer, building agents that ship">
<style>
.m{font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace} .s{font-size:10px;letter-spacing:.8px;font-weight:700} .xs{font-size:8px;letter-spacing:1.2px}
.big{font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:50px;font-weight:700;letter-spacing:-1px}
.sf{font-family:Georgia,'Times New Roman',serif;font-size:14px}
.fl{animation:fl 4.5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.dash{stroke-dashoffset:40;animation:dr 1.2s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
text.s,text.xs{animation:fi .8s ease-out .6s forwards}
@keyframes fi{to{opacity:1}}
.cur{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.t1{opacity:0;animation:fi .7s ease-out .1s forwards}
.t2{opacity:0;animation:fi .7s ease-out .5s forwards}
.t3{opacity:0;animation:fi .7s ease-out .9s forwards}
.t4{opacity:0;animation:fi .7s ease-out 1.3s forwards}
.dot{animation:mv 6s linear infinite}
@keyframes mv{from{transform:translateX(0)}to{transform:translateX(904px)}}
.scan{animation:sc 5s ease-in-out infinite}
@keyframes sc{0%,100%{opacity:.15}50%{opacity:.55}}
</style>
<rect width="1000" height="360" fill="#F6F5EF"/>
<rect x="0.5" y="0.5" width="999" height="359" fill="none" stroke="#e3e1d6"/>
<text x="48" y="36" class="m xs t1" fill="#2B5BFF">FIG_000 · PROFILE · V1.0</text>
<text x="952" y="36" text-anchor="end" class="m xs t1" fill="#8a8a85">2026 · OPEN TO BUILD · AT ATOS</text>
<text x="48" y="122" class="big t2" fill="#2B5BFF">BUILDING AGENTS</text>
<text x="48" y="178" class="big t3" fill="#111111">THAT SHIP.<tspan class="cur" fill="#2B5BFF">_</tspan></text>
<text x="48" y="222" class="sf t4" fill="#111111">John Smilin D.S. — AI Engineer at Atos. I design and build agentic</text>
<text x="48" y="243" class="sf t4" fill="#111111">systems end-to-end: coding agents, RAG, multi-agent orchestration.</text>
<text x="48" y="282" class="m xs t4" fill="#2B5BFF">ATOS CODING AGENT · ORDYRR · RESUMENOVA</text>
<text x="48" y="298" class="m xs t4" fill="#8a8a85">AGENTS · SKILLS · MCP · RAG · DEVOPS</text>
<text x="620" y="64" class="m xs t1" fill="#2B5BFF">FIG_000.A · CAPABILITY STACK</text>
