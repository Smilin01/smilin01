<line class="dash" x1="762" y1="248" x2="802" y2="248" stroke="#2B5BFF" stroke-width="0.8" stroke-dasharray="2 3" style="animation-delay:2.0999999999999996s"/>
<text x="808" y="251" class="m s" fill="#2B5BFF" style="animation-delay:2.0999999999999996s" opacity="0">CLOUD · DEVOPS</text>
