<line class="dash" x1="762" y1="170" x2="802" y2="170" stroke="#2B5BFF" stroke-width="0.8" stroke-dasharray="2 3" style="animation-delay:1.0499999999999998s"/>
<text x="808" y="173" class="m s" fill="#2B5BFF" style="animation-delay:1.0499999999999998s" opacity="0">RAG · RETRIEVAL</text>
<text x="808" y="183" class="m xs" fill="#8a8a85" style="animation-delay:1.0499999999999998s" opacity="0">LAYER 04</text>
<line class="dash" x1="762" y1="196" x2="802" y2="196" stroke="#2B5BFF" stroke-width="0.8" stroke-dasharray="2 3" style="animation-delay:1.4s"/>
<text x="808" y="199" class="m s" fill="#2B5BFF" style="animation-delay:1.4s" opacity="0">LLM · PROMPTS</text>
