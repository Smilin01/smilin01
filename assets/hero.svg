<g class="fl" style="animation-delay:0.35s"><polygon points="620,118 690,92 760,118 690,144" fill="#2B5BFF" fill-opacity="0.23" stroke="#2B5BFF" stroke-width="1.2"/></g>
<g class="fl" style="animation-delay:0.7s"><polygon points="620,144 690,118 760,144 690,170" fill="#2B5BFF" fill-opacity="0.20" stroke="#2B5BFF" stroke-width="1.2"/></g>
<g class="fl" style="animation-delay:1.0499999999999998s"><polygon points="620,170 690,144 760,170 690,196" fill="#2B5BFF" fill-opacity="0.18" stroke="#2B5BFF" stroke-width="1.2"/></g>
<g class="fl" style="animation-delay:1.4s"><polygon points="620,196 690,170 760,196 690,222" fill="#2B5BFF" fill-opacity="0.15" stroke="#2B5BFF" stroke-width="1.2"/></g>
<g class="fl" style="animation-delay:1.75s"><polygon points="620,222 690,196 760,222 690,248" fill="#2B5BFF" fill-opacity="0.12" stroke="#2B5BFF" stroke-width="1.2"/></g>
<g class="fl" style="animation-delay:2.0999999999999996s"><polygon points="620,248 690,222 760,248 690,274" fill="#2B5BFF" fill-opacity="0.10" stroke="#2B5BFF" stroke-width="1.2"/></g>
