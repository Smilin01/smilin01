<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img">
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F3A8A" flood-opacity=".08"/></filter>
<linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF2FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1E6"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8DB8FF"/><stop offset="1" stop-color="#1A6BF0"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.a1{opacity:0;animation:fi .8s ease-out .1s forwards}.a2{opacity:0;animation:fi .8s ease-out .35s forwards}.a3{opacity:0;animation:fi .8s ease-out .6s forwards}.a4{opacity:0;animation:fi .8s ease-out .85s forwards}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bl{50%{opacity:0}}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes da{to{stroke-dashoffset:-14}}
.fl{animation:fl 5s ease-in-out infinite}.cur{animation:bl 1s steps(1) infinite}.pu{animation:pu 2.4s ease-in-out infinite}
</style>
<rect width="720" height="340" fill="#FBF8F4"/>
<text x="40" y="44" class="a1" font-size="12" letter-spacing="3.5" fill="#6B7280">JOHN SMILIN D.S.</text>
<circle cx="392" cy="40" r="4" class="pu" fill="#1A6BF0"/><text x="680" y="44" text-anchor="end" class="a1" font-size="12" letter-spacing="2.5" fill="#6B7280">AI ENGINEER · AGENTIC SYSTEMS</text>
<text x="40" y="116" class="a2" font-size="46" font-weight="800" fill="#0F1B33" letter-spacing="-1.5">Agentic AI,</text>
<text x="40" y="170" class="a2" font-size="46" font-weight="800" fill="#1A6BF0" letter-spacing="-1.5">built to run</text>
<text x="40" y="224" class="a3" font-size="46" font-weight="800" fill="#0F1B33" letter-spacing="-1.5">in production.<tspan class="cur" fill="#1A6BF0" font-weight="300">|</tspan></text>
<text x="40" y="270" class="a4" font-size="16" fill="#6B7280">AI Engineer at Atos. I design agent systems</text><text x="40" y="292" class="a4" font-size="16" fill="#6B7280">end to end: reasoning loops, tool use, retrieval,</text><text x="40" y="314" class="a4" font-size="16" fill="#6B7280">and the cloud under them.</text><g class="fl" style="animation-delay:0.0s"><polygon points="465,130 565,93 665,130 565,167" fill="url(#gl)" fill-opacity="0.35" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/></g>
<g class="fl" style="animation-delay:0.4s"><polygon points="465,160 565,123 665,160 565,197" fill="url(#gl)" fill-opacity="0.5" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/></g>
<g class="fl" style="animation-delay:0.8s"><polygon points="465,190 565,153 665,190 565,227" fill="url(#gl)" fill-opacity="0.7" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/></g>
<g class="fl" style="animation-delay:1.2000000000000002s"><polygon points="465,220 565,183 665,220 565,257" fill="url(#gl)" fill-opacity="0.9" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/></g>
<circle cx="440" cy="82" r="6" fill="#DCE8FF"/><circle cx="440" cy="82" r="3.5" class="pu" fill="#1A6BF0"/><text x="454" y="86" text-anchor="start" font-size="11" letter-spacing="2" fill="#6B7280">REASON</text>
<circle cx="690" cy="82" r="6" fill="#DCE8FF"/><circle cx="690" cy="82" r="3.5" class="pu" fill="#1A6BF0"/><text x="676" y="86" text-anchor="end" font-size="11" letter-spacing="2" fill="#6B7280">RETRIEVE</text>
<circle cx="440" cy="250" r="6" fill="#DCE8FF"/><circle cx="440" cy="250" r="3.5" class="pu" fill="#1A6BF0"/><text x="454" y="254" text-anchor="start" font-size="11" letter-spacing="2" fill="#6B7280">ACT</text>
<circle cx="690" cy="250" r="6" fill="#DCE8FF"/><circle cx="690" cy="250" r="3.5" class="pu" fill="#1A6BF0"/><text x="676" y="254" text-anchor="end" font-size="11" letter-spacing="2" fill="#6B7280">VERIFY</text>
</svg>